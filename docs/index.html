<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Namma Ward</title>
  <meta name="description" content="Report civic issues in your ward, track complaints and see verified ward updates.">
  <meta name="theme-color" content="#E86A10">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin="">
  <link rel="stylesheet" href="css/app.css">
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>
</head>
<body>
  <header class="top">
    <a href="#/" class="brand"><img src="icons/icon.svg" alt="" width="28" height="28"><span id="brand">Namma Ward</span></a>
    <div class="top-actions">
      <select id="wardSelect" aria-label="Ward"></select>
      <button id="langBtn" class="btn ghost sm" type="button">ಕನ್ನಡ</button>
      <button id="installBtn" class="btn ghost sm" type="button" hidden>Install</button>
    </div>
  </header>
  <div id="offline" class="banner" hidden>Offline</div>
  <div id="pending" class="banner info" hidden></div>
  <div id="demo" class="banner demo" hidden></div>
  <main id="view" class="wrap" aria-live="polite"></main>
  <nav class="bottom">
    <a href="#/" data-nav="home">Home</a>
    <a href="#/report" data-nav="report">Report</a>
    <a href="#/track" data-nav="track">Track</a>
    <a href="#/map" data-nav="map">Map</a>
    <a href="#/dashboard" data-nav="dashboard">Report</a>
  </nav>
  <div id="toast" class="toast" hidden role="status"></div>
  <script type="module" src="js/app.js"></script>
</body>
</html>
